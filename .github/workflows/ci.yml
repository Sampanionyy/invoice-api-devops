name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # Se connecter à DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Générer un tag unique basé sur le SHA du commit
      - name: Set image tag
        id: tag
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # Builder et pusher l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            sampaniony/invoice-api:${{ steps.tag.outputs.TAG }}
            sampaniony/invoice-api:latest

      # Mettre à jour le tag dans values.yaml
      - name: Update image tag in values.yaml
        run: |
          sed -i "s/^  tag:.*/  tag: \"${{ steps.tag.outputs.TAG }}\"/" helm/invoice-api/values.yaml
          sed -i "s|^  repository:.*|  repository: sampaniony/invoice-api|" helm/invoice-api/values.yaml

      # Committer et pusher le values.yaml mis à jour
      # ArgoCD détectera ce changement et redéploiera automatiquement
      - name: Commit updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/invoice-api/values.yaml
          git commit -m "ci: update image tag to ${{ steps.tag.outputs.TAG }}"
          git push
